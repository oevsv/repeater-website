<!-- The map page (/) is full screen and brings its own floating widgets
     (menu drawer, search, login). Other pages get a slim header and footer. -->
<header *ngIf="isListPage" class="page-bar">
  <a routerLink="/" class="page-brand">
    <img src="assets/oevsv_banner_white.svg" alt="ÖVSV">
  </a>
  <a routerLink="/" class="page-back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span i18n="@@bcRepeaterMap">Repeater-Map</span>
  </a>
  <app-login-widget class="page-user"></app-login-widget>
</header>

<router-outlet></router-outlet>

<footer *ngIf="isListPage" class="page-footer">
  <a href="https://www.oevsv.at/impressum/" i18n="@@imprint">
    Legal notice</a>
  <a href="mailto:ukw@oevsv.at">ukw&#64;oevsv.at</a>
  <span class="page-lang">
    <a href="/de/list" i18n="@@deutsch">Deutsch</a> ·
    <a href="/en/list" i18n="@@english">English</a>
  </span>
</footer>
