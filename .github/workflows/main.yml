name: Build

# Builds every pushed branch. Each branch deploys to its own output branch, so
# feature branches never overwrite the master build:
#   master        -> gh-pages
#   feature/xyz   -> gh-pages-feature-xyz   ("/" replaced by "-")
# "Run workflow" in the Actions tab rebuilds a branch on demand.
on:
  push:
  workflow_dispatch:

# One deployment per branch at a time; a newer push supersedes a running one.
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the output branch

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Angular 22 requires Node >= 22.12
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Choose output branch
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "master" ]; then
            echo "branch=gh-pages" >> "$GITHUB_OUTPUT"
          else
            echo "branch=gh-pages-${BRANCH//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ steps.target.outputs.branch }}
          folder: dist/frq-map
          clean: true # remove files deleted since the last build
